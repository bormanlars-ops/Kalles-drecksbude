name: Build KALLE Drecksbude APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Kalle-Drecksbude-Spielprojekt-NEUER-DOWNLOAD.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.4.1'
      ZIP_FILE: 'Kalle-Drecksbude-Spielprojekt-NEUER-DOWNLOAD.zip'
      GAME_DIR: 'project-files/KALLE_DRECKSBUDE_0.1_Godot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract actual Godot project
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ZIP_FILE" || { echo "::error::Bitte ZIP-Datei '$ZIP_FILE' ins Repository hochladen."; exit 1; }
          mkdir -p project-files
          unzip -q "$ZIP_FILE" -d project-files
          test -s "$GAME_DIR/project.godot"
          test -s "$GAME_DIR/export_presets.cfg"
          # Android headless exports require ETC2/ASTC import enabled even on x86_64 Linux.
          sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' "$GAME_DIR/project.godot"
          grep -Fq "textures/vram_compression/import_etc2_astc=true" "$GAME_DIR/project.godot"
          echo "Godot project found: $GAME_DIR"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Prepare Android SDK and temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and validate Godot scripts and resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$GAME_DIR"
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/kalle-import.log
          if grep -qiE 'SCRIPT ERROR|Parse Error|Parser Error' /tmp/kalle-import.log; then
            echo "::error::Godot import reported parse errors."
            exit 1
          fi

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cd "$GAME_DIR"
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/KALLE-DRECKSBUDE-0.1-debug.apk" 2>&1 | tee /tmp/kalle-export.log
          test -s build/KALLE-DRECKSBUDE-0.1-debug.apk
          unzip -t build/KALLE-DRECKSBUDE-0.1-debug.apk | tail -1
          echo "Built APK:"
          ls -lh build/KALLE-DRECKSBUDE-0.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KALLE-DRECKSBUDE-0.1-debug-APK
          path: project-files/KALLE_DRECKSBUDE_0.1_Godot/build/KALLE-DRECKSBUDE-0.1-debug.apk
          retention-days: 14

      - name: Upload build logs if failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: KALLE-DRECKSBUDE-build-logs
          path: |
            /tmp/kalle-import.log
            /tmp/kalle-export.log
          if-no-files-found: ignore
          retention-days: 7
